<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#eee7dc"><title>同窗一程 · 輸入密碼</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#eee9de;color:#544b40;font-family:'Songti TC','Songti SC',serif;padding:28px;overflow:hidden}body:before{content:'';position:fixed;width:90vw;height:50vh;bottom:-25vh;left:-20vw;border-radius:50%;background:#b3c0ae20;box-shadow:55vw -8vh 0 3vw #a7b8aa18;z-index:-1}.branch{position:absolute;right:-80px;top:8%;width:380px;height:180px;transform:rotate(-24deg);border-top:5px solid #8b7d6d55;pointer-events:none}.blossom{position:absolute;right:18%;top:8%;font-size:80px;color:#d49aa56b;letter-spacing:15px;transform:rotate(-18deg);pointer-events:none}.petal{position:absolute;top:-30px;width:10px;height:16px;border-radius:90% 10% 80% 20%;background:#d8a0ac77;animation:fall 17s linear infinite;pointer-events:none}.petal:nth-of-type(2){left:15%;animation-delay:-7s}.petal:nth-of-type(3){left:38%;animation-delay:-12s}.petal:nth-of-type(4){left:73%;animation-delay:-3s}.petal:nth-of-type(5){left:91%;animation-delay:-9s}@keyframes fall{to{transform:translate(-90px,110vh) rotate(360deg)}}main{width:min(390px,100%);text-align:center;position:relative}.stamp{display:inline-grid;place-items:center;width:36px;height:42px;border:1px solid #a96860;color:#a96860;font-size:16px;letter-spacing:2px;writing-mode:vertical-rl;transform:rotate(-4deg)}.eyebrow{font-size:11px;letter-spacing:5px;color:#a58f75;margin:25px 0 12px}h1{font-size:44px;font-weight:400;letter-spacing:9px;margin:0 0 15px;padding-left:9px;color:#46514a}.intro{font-size:13px;line-height:2;letter-spacing:2px;color:#8c7e6b;margin:0 0 32px}.field{display:flex;border:1px solid #b7a58b;background:#f8f3e969;align-items:center}input{min-width:0;flex:1;border:0;background:transparent;padding:16px;font-size:15px;color:#514537;outline:none}input:focus{box-shadow:inset 0 0 0 1px #a57d69}button{cursor:pointer;font:inherit}#show{background:none;border:0;padding:12px;color:#9c866d;font-size:11px;letter-spacing:1px}#unlock{display:block;margin-top:14px;width:100%;padding:15px;background:#786955;color:#fff8ec;border:1px solid #786955;letter-spacing:6px;font-size:14px}#unlock:disabled{opacity:.6;cursor:wait}#message{min-height:38px;font-size:12px;letter-spacing:1px;color:#a56761;line-height:1.8;margin:14px 0}.note{font-size:10px;letter-spacing:2px;color:#a59680;border-top:1px solid #c3b69f55;padding-top:23px;margin:10px 0 0}button:focus-visible{outline:2px solid #a96860;outline-offset:4px}@media(prefers-reduced-motion:reduce){.petal{display:none}}</style></head><body><div class="branch" aria-hidden="true"></div><div class="blossom" aria-hidden="true">✿ ✿</div><i class="petal" aria-hidden="true"></i><i class="petal" aria-hidden="true"></i><i class="petal" aria-hidden="true"></i><i class="petal" aria-hidden="true"></i><main><div class="stamp" aria-hidden="true">同窗</div><p class="eyebrow">一筆一名 · 一程青春</p><h1>同窗一程</h1><p class="intro">春風有信，故人有期<br>請輸入密碼，開啟這一頁歌聲。</p><form id="gate"><div class="field"><input id="password" name="password" type="password" placeholder="請輸入訪問密碼" aria-label="訪問密碼" autocomplete="off" required><button id="show" type="button" aria-label="顯示密碼">顯示</button></div><button id="unlock" type="submit">開啟歌聲</button><p id="message" role="status" aria-live="polite"></p></form><p class="note">音樂與歌詞於輸入正確密碼後開啟</p></main><script>
const field=document.getElementById('password'),button=document.getElementById('unlock'),message=document.getElementById('message');let payload;
document.getElementById('show').onclick=()=>{let visible=field.type==='password';field.type=visible?'text':'password';document.getElementById('show').textContent=visible?'隱藏':'顯示';document.getElementById('show').setAttribute('aria-label',visible?'隱藏密碼':'顯示密碼')};
document.getElementById('gate').onsubmit=async e=>{e.preventDefault();if(!field.value)return;button.disabled=true;button.textContent='正在開啟…';message.textContent='';try{if(!crypto.subtle)throw new Error('unsupported');if(!payload){const response=await fetch('payload.bin',{cache:'no-store'});if(!response.ok)throw new Error('network');payload=new Uint8Array(await response.arrayBuffer())}const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:payload.slice(0,16),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:payload.slice(16,28)},key,payload.slice(28));field.value='';const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}catch(error){message.textContent=error.message==='network'?'音訊暫時未能載入，請稍後再試。':error.message==='unsupported'?'請使用新版 Chrome、Safari 或 Edge 開啟。':'密碼不正確，請重新輸入。';button.disabled=false;button.textContent='開啟歌聲';field.focus()}};
</script></body></html>
